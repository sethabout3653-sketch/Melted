    <script>
      (function(){
        try {
          var saved = localStorage.getItem('frosthub_theme');
          // Dark mode is default unless user explicitly set to 'light'
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e){}
        try {
          if (typeof WebSocket !== 'undefined' && !window.__frostWasmWsGuardInstalled) {
            window.__frostWasmWsGuardInstalled = true;
            var proto = WebSocket.prototype;
            var map = new WeakMap();
            ['onopen', 'onclose', 'onerror', 'onmessage'].forEach(function(prop) {
              try {
                var desc = Object.getOwnPropertyDescriptor(proto, prop);
                if (!desc || !desc.configurable || typeof desc.set !== 'function') return;
                var origGet = desc.get, origSet = desc.set;
                Object.defineProperty(proto, prop, {
                  configurable: true,
                  enumerable: desc.enumerable !== false,
                  get: function() {
                    var m = map.get(this);
                    if (m && prop in m) return m[prop];
                    return origGet ? origGet.call(this) : null;
                  },
                  set: function(val) {
                    var m = map.get(this);
                    if (!m) { m = {}; map.set(this, m); }
                    if (val == null) { delete m[prop]; origSet.call(this, null); return; }
                    var orig = typeof val === 'function' ? val.original : null;
                    if (!orig || typeof orig !== 'object' || !('a' in orig) || !('cnt' in orig) || !('dtor' in orig)) {
                      delete m[prop]; origSet.call(this, val); return;
                    }
                    if (orig.a === 0) { delete m[prop]; origSet.call(this, null); return; }
                    m[prop] = val;
                    origSet.call(this, function() {
                      if (!orig || orig.a === 0) {
                        var cm = map.get(this); if (cm) delete cm[prop];
                        try { origSet.call(this, null); } catch(e) {}
                        return;
                      }
                      try {
                        return val.apply(this, arguments);
                      } catch (err) {
                        var msg = String((err && err.message) || err || '');
                        if (msg.indexOf('closure invoked after being dropped') !== -1) {
                          var cm2 = map.get(this); if (cm2) delete cm2[prop];
                          try { origSet.call(this, null); } catch(e) {}
                          return;
                        }
                        throw err;
                      }
                    });
                  }
                });
              } catch(e) {}
            });
          }
        } catch(e) {}
      })();
    </script>

    <script>
      (function() {
        try {
          var PRESETS = {
            default: { title: 'FrostHub — Unblocked Games & Arcades', favicon: '/assets/cloaks/frosthub.svg' },
            google: { title: 'Google', favicon: 'https://favicon.vemetric.com/google.com' },
            classroom: { title: 'Classes', favicon: 'https://favicon.vemetric.com/classroom.google.com' },
            drive: { title: 'My Drive - Google Drive', favicon: 'https://favicon.vemetric.com/drive.google.com' },
            desmos: { title: 'Desmos | Graphing Calculator', favicon: 'https://favicon.vemetric.com/desmos.com' },
            canvas: { title: 'Dashboard', favicon: 'https://favicon.vemetric.com/canvas.instructure.com' },
            clever: { title: 'Clever | Portal', favicon: 'https://favicone.com/clever.com' }
          };

          var savedPreset = localStorage.getItem('melted_cloak_preset') || 'default';
          var customTitle = localStorage.getItem('melted_cloak_custom_title');
          var customFavicon = localStorage.getItem('melted_cloak_custom_favicon');

          var targetTitle = (savedPreset === 'custom' && customTitle) ? customTitle : (PRESETS[savedPreset] ? PRESETS[savedPreset].title : PRESETS.default.title);
          var targetFavicon = (savedPreset === 'custom' && customFavicon) ? customFavicon : (PRESETS[savedPreset] ? PRESETS[savedPreset].favicon : PRESETS.default.favicon);

          if (targetTitle) document.title = targetTitle;
          if (targetFavicon) {
            var isSvg = targetFavicon.indexOf('.svg') !== -1 || targetFavicon.indexOf('image/svg+xml') !== -1;
            var isPng = targetFavicon.indexOf('.png') !== -1 || targetFavicon.indexOf('image/png') !== -1;
            var mime = isSvg ? 'image/svg+xml' : (isPng ? 'image/png' : 'image/x-icon');

            var link = document.getElementById('dynamic-favicon');
            if (link) {
              link.type = mime;
              link.href = targetFavicon;
            }
            var shortcut = document.getElementById('dynamic-shortcut-icon');
            if (shortcut) {
              shortcut.type = mime;
              shortcut.href = targetFavicon;
            }
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;

        function getFaviconHref() {
          var iconEl =
            document.querySelector('link[rel="icon"]') ||
            document.querySelector('link[rel="shortcut icon"]') ||
            document.querySelector('link[rel*="icon"]');
          return iconEl ? iconEl.href : '';
        }

        function sendTabMetadata() {
          var href = getFaviconHref();
          if (href && !href.startsWith('data:') && !href.startsWith('blob:') && !href.startsWith('http')) {
            try {
              href = new URL(href, window.location.href).href;
            } catch (e) {}
          }
          window.parent.postMessage(
            {
              type: 'TAB_METADATA_UPDATE',
              title: document.title,
              favicon: href
            },
            '*'
          );
        }

        window.addEventListener('DOMContentLoaded', sendTabMetadata);
        window.addEventListener('load', sendTabMetadata);
        window.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'REQUEST_TAB_METADATA') {
            sendTabMetadata();
          }
        });

        var observer = new MutationObserver(sendTabMetadata);
        function observeHead() {
          if (document.head) {
            observer.observe(document.head, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['href', 'rel'],
              characterData: true
            });
            sendTabMetadata();
          } else {
            requestAnimationFrame(observeHead);
          }
        }

        observeHead();
      })();
    </script>
